<text x="1190" y="706" font-size="13" font-weight="640" fill="#52514e">How to read it</text>
<text x="1190" y="734" font-size="12.2" fill="#52514e">A flat line at 100% is perfect scaling.</text>
<text x="1190" y="755" font-size="12.2" fill="#52514e">Above 100% is superlinear: the one-rank</text>

<text x="1190" y="818" font-size="12.2" fill="#52514e">each tile into cache.</text>
<text x="1190" y="839" font-size="12.2" fill="#52514e"></text>
<text x="1190" y="860" font-size="12.2" fill="#52514e">Below 100% is lost parallel efficiency;</text>

<text x="48" y="1034" font-size="12" fill="#8a8984">2-6 steps per point after a one-step warm-up, all runs no-output. BL_TEST reaches 184% at 32 ranks.</text>
